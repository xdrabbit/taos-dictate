# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
# The .xcodeproj is generated; edit this file, not the project.
name: TaosDictate
options:
  bundleIdPrefix: com.taoslite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing team: chosen by Tom in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  TaosDictate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Supabase
        product: Auth
      - target: TaosKeyboard
        embed: true
    entitlements:
      path: App/TaosDictate.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taoslite.dictate
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TAOS Dictate
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "TAOS Dictate records your voice so it can turn what you say into clean text."
        CFBundleURLTypes:
          - CFBundleURLName: com.taoslite.dictate
            CFBundleURLSchemes: [taosdictate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoslite.dictate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  TaosKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    entitlements:
      path: Keyboard/TaosKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taoslite.dictate
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TAOS
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            # Full Access is required to read the App Group container the app
            # writes the last dictation into. See README "Keyboard & Full Access".
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoslite.dictate.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
