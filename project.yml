# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
# The .xcodeproj is generated; edit this file, not the project.
name: TaosDictate
options:
  bundleIdPrefix: com.taoslite
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Team, bundle ID, App Group and backend URL live in Config/Base.xcconfig
# (override per Mac in the gitignored Config/Local.xcconfig).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  TaosDictate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # DEBUG -kbPreview hosts the keyboard inside the app to check its layout.
      - path: Keyboard/KeyboardViewController.swift
    dependencies:
      - package: Supabase
        product: Auth
      - target: TaosKeyboard
        embed: true
    entitlements:
      path: App/TaosDictate.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TAOS_APP_GROUP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TAOS Dictate
        TaosAppGroup: $(TAOS_APP_GROUP)
        TaosDictateURL: $(TAOS_DICTATE_URL)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keeps recording for the TAOS keyboard after the user goes back to their chat.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "TAOS Dictate records your voice so it can turn what you say into clean text."
        CFBundleURLTypes:
          - CFBundleURLName: com.taoslite.dictate
            CFBundleURLSchemes: [taosdictate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAOS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  TaosKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    entitlements:
      path: Keyboard/TaosKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TAOS_APP_GROUP)
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TAOS
        TaosAppGroup: $(TAOS_APP_GROUP)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            # Full Access is required to read the App Group container the app
            # writes the last dictation into. See README "Keyboard & Full Access".
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAOS_BUNDLE_ID).keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

  # Menu bar app for the Mac: hold Right Option, talk, let go — typed where the cursor is.
  TaosMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: App/Services/DictateAPI.swift
      - path: App/Services/AuthManager.swift
    dependencies:
      - package: Supabase
        product: Auth
    entitlements:
      path: Mac/TaosMac.entitlements
      properties:
        # Hardened runtime needs this to use the microphone. Not sandboxed:
        # pasting into other apps needs Accessibility, which the sandbox blocks.
        com.apple.security.device.audio-input: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: TAOS
        # Menu bar only: no Dock icon.
        LSUIElement: true
        # No App Group on the Mac; this is just the name of its own settings file.
        TaosAppGroup: $(TAOS_BUNDLE_ID).mac
        TaosDictateURL: $(TAOS_DICTATE_URL)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSMicrophoneUsageDescription: "TAOS records your voice while you hold the talk key, so it can type what you say."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAOS_BUNDLE_ID).mac
        ENABLE_HARDENED_RUNTIME: YES
